spring:
  application:
    name: codex-ai-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  error:
    include-message: never

# MyBatis-Plus 通用配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

# JWT 通用结构，密钥与过期时间可被环境变量覆盖
jwt:
  header: Authorization
  token-prefix: "Bearer "
  expiration: ${JWT_EXPIRATION:86400000}        # 24h（毫秒）
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7d（毫秒）

# AI 模型配置（无 Key 时本地兜底回复，不阻塞 MVP）
ai:
  provider: ${AI_PROVIDER:siliconflow}
  base-url: ${AI_BASE_URL:https://api.siliconflow.cn}
  api-key: ${AI_API_KEY:}
  default-model: ${AI_DEFAULT_MODEL:deepseek-ai/DeepSeek-V3}

# 产品版本（同意记录用）
app:
  versions:
    privacy-policy: privacy-v1.0
    sensitive-info: sensitive-v1.0
    product-boundary: boundary-v1.0
