spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    openai:
      chat:
        options:
          model: deepseek-v4-pro
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key: sk-REVOKED-REMOVED-FROM-HISTORY  
      base-url: https://api.deepseek.com
    mcp:
      server:
        protocol: STREAMABLE
        name: mental-health-knowledge-server
        version: 1.0.0
# 服务器配置
server:
  port: 1236

# JWT配置
jwt:
  secret: MySecretKeyForJWT2025!@#$%^&*()_+SecureKeyHere
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀

# 文件上传目录（相对于运行目录）
app:
  upload-dir: uploads
